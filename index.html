<!DOCTYPE html>
<html lang="ko">

<head>
 <link href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌳 미숲랭 🌳</title>

    <style>
     body{

    margin:0;

    min-height:100vh;

    background-image:url("woopu background.png");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    font-family: "Poor Story", cursive;

    }

    .container{border:0;
               display:flex;
            flex-direction:column;
        justify-content: center;
    align-items: center;
height:100vh;}
#intro {opacity: 0;
transform: translateY(10px);
transition: opacity 0.5s, transform 0.5s;
}
#intro.show{
    opacity:1;
    transform:translateY(0);
}
button{
    font-family: "Poor Story", cursive;
    font-size: 22px;

    background: #7CCB6C;

    color: white;

    border: none;

    padding: 16px 36px;

    border-radius: 40px;

    cursor: pointer;

    transition: 0.3s;
    
    background: linear-gradient(135deg, #A1DB8D, #8BD067);
    box-shadow: 0 8px 20px rgba(139, 208, 103, 0.35);

}
.woopu-button{
    position: relative;
    display: inline-block;
    margin-top: 120px;
}

.woopu-button button{
    font-family: "Poor Story", cursive;
    font-size: 24px;

    background-color: #A1DB8D;
    color: white;

    border: none;
    border-radius: 35px;

    padding: 18px 42px;
    cursor: pointer;

    position: relative;
    z-index: 2;
}

.woopu-face{
    position: absolute;

    width: 150px;

    left: 50%;
    top: -115px;

    transform: translateX(-50%);

    z-index: 1;
}

.woopu-hand{
    position: absolute;

    width: 38px;
    height: 38px;

    background-color: #a8df8e;
    border-radius: 50%;

    top: -8px;

    z-index: 3;

    font-size: 0;
}

.left-hand{
    left: 12px;
}

.right-hand{
    right: 12px;
}
.booth-link{
    display: inline-block;
    font-family: "Poor Story", cursive;
    font-size: 22px;
    color: white;
    text-decoration: none;

    background-color: #8BD067;
    padding: 16px 36px;
    border-radius: 40px;
}
img,
video{
    max-width: 100%;
    height: auto;
}
.video-frame{
    width: min(960px, 90%);
    margin: 40px auto;
}




    </style>
</head>

<body>
    <div class="container">
      <h1>🌳 미숲랭 🌳</h1>

    <p>숲을 차려드립니다.</p>

    <div class="woopu-button">

    <img src="woopu head.png"
         class="woopu-face"
         alt="우푸 얼굴">

    <button onclick="location.href='booth.html'">
        🌿 부스 소개 보기 🌿
    </button>

</div>
<p id="intro">
    🌳 미숲랭은 숲 보존의 중요성과
    산불 예방을 체험하는 전시입니다.🌳
</p>

    </div>
    <script>
    function toggleIntro() {
           const intro = document.getElementById("intro");
intro.classList.toggle("show");
    }
</script>
</body>


</html>
