<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        href="https://fonts.googleapis.com/css2?family=Poor+Story&display=swap"
        rel="stylesheet"
    >

    <title>🤝 약숲해 🤝</title>

    <style>
        *{
            box-sizing: border-box;
        }

        body{
            margin: 0;
            min-height: 100vh;

            background-image: url("woopu background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            font-family: "Poor Story", cursive;
            color: #243124;
        }

        img{
            max-width: 100%;
            height: auto;
        }

        button,
        input,
        a{
            font-family: "Poor Story", cursive;
        }

        h1{
            margin: 0;
            padding: 30px 20px 0;

            text-align: center;
            font-size: 44px;
        }

        .page-container{
            width: 100%;
            padding-bottom: 120px;
        }

        /* 메뉴판 + 영수증 */
        .promise-container{
            display: flex;
            justify-content: center;
            align-items: stretch;

            gap: 55px;

            width: min(1450px, 92%);
            margin: 45px auto 55px;
        }

        .promise-box{
            width: 50%;
            min-width: 0;

            padding: 35px;

            background: rgba(255, 255, 255, 0.86);

            border: 5px solid #8BD067;
            border-radius: 35px;

            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.14);
        }

        .promise-box h2{
            width: 100%;
            margin: 0 0 28px;

            text-align: center;
            font-size: 32px;
            line-height: 1.4;

            color: #39723A;
        }

        /* 왼쪽 메뉴판 */
        .menu-image-box{
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100%;
            height: 750px;

            overflow: hidden;
        }

        .menu-image{
            width: 100%;
            height: 100%;

            object-fit: contain;
            display: block;
        }

        /* 오른쪽 영수증 */
        .receipt-content{
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 22px;

            padding: 28px;

            background: #FFFDF6;

            border: 3px dashed #8BD067;
            border-radius: 25px;
        }

        .receipt-form{
            position: relative;

            width: min(540px, 100%);
            margin: 0 auto;
        }

        .receipt-image{
            width: 100%;
            height: auto;

            display: block;
        }

        /* 실천 입력칸 */
        .receipt-input{
            position: absolute;

            left: 18%;
            top: 39.2%;

            width: 70%;
            height: 34px;

            transform: translateY(-50%);

            padding: 2px 8px;

            border: none;
            outline: none;

            background: rgba(255, 255, 255, 0.72);
            border-radius: 8px;

            font-size: 19px;
            color: #2E5C32;

            text-align: center;
        }

        .receipt-input::placeholder{
            color: rgba(77, 77, 77, 0.55);
        }

        .receipt-input:focus{
            background: rgba(235, 255, 222, 0.92);

            box-shadow:
                0 0 0 2px rgba(139, 208, 103, 0.45);
        }

        /* 사진 첨부 영역 */
        .photo-area{
            position: absolute;

            left: 14%;
            top: 43.7%;

            width: 72%;
            height: 25.5%;

            border: 3px dashed #78C35D;
            border-radius: 22px;

            overflow: hidden;

            background: rgba(255, 253, 246, 0.55);

            cursor: pointer;
        }

        .photo-area:hover{
            background: rgba(237, 255, 226, 0.68);
        }

        .photo-input{
            display: none;
        }

        .photo-guide{
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            gap: 10px;

            padding: 16px;

            text-align: center;

            color: #69A94B;
            font-size: 20px;
            line-height: 1.45;
        }

        .photo-icon{
            font-size: 38px;
        }

        .uploaded-photo{
            width: 100%;
            height: 100%;

            display: none;

            object-fit: cover;
        }

        .photo-area.has-photo .uploaded-photo{
            display: block;
        }

        .photo-area.has-photo .photo-guide{
            display: none;
        }

        /* 사진 삭제 버튼 */
        .delete-photo-button{
            position: absolute;

            top: 44.5%;
            right: 14.5%;

            z-index: 20;

            display: none;
            justify-content: center;
            align-items: center;

            width: 42px;
            height: 42px;

            padding: 0;

            border: 2px solid #8BD067;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.95);

            font-size: 20px;
            cursor: pointer;

            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.16);

            transition:
                transform 0.2s,
                background 0.2s;
        }

        .delete-photo-button.show{
            display: flex;
        }

        .delete-photo-button:hover{
            transform: scale(1.08);
            background: #FDFDF8;
        }

        .delete-photo-button:active{
            transform: scale(0.92);
        }

        /* 저장 버튼 */
        .receipt-save-button{
            display: inline-flex;
            justify-content: center;
            align-items: center;

            gap: 8px;

            min-width: 230px;
            min-height: 62px;

            padding: 14px 30px;

            border: 3px solid #78C35D;
            border-radius: 35px;

            background: linear-gradient(
                135deg,
                #A8DD82,
                #8BD067
            );

            color: white;

            font-size: 25px;

            cursor: pointer;

            box-shadow:
                0 8px 16px rgba(82, 135, 61, 0.22),
                inset 0 2px 3px rgba(255, 255, 255, 0.35);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }

        .receipt-save-button:hover{
            transform: translateY(-4px);

            box-shadow:
                0 12px 20px rgba(82, 135, 61, 0.28),
                inset 0 2px 3px rgba(255, 255, 255, 0.35);
        }

        .receipt-save-button:active{
            transform: translateY(0) scale(0.96);
        }

        /* 미래 뉴스 */
        .future-section{
            width: min(1450px, 92%);
            margin: 0 auto;
        }

        .future-header{
            width: min(1100px, 92%);

            margin: 0 auto 35px;
            padding: 28px 35px;

            background: rgba(255, 255, 255, 0.86);

            border: 5px solid #8BD067;
            border-radius: 30px;

            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.13);

            text-align: center;
        }

        .future-heading{
            margin: 0 0 18px;

            font-size: 40px;
            color: #39723A;
        }

        .future-text{
            margin: 0;

            font-size: 24px;
            line-height: 1.7;

            color: #243124;
        }

        /* 코르크판 */
        .future-board{
            position: relative;

            padding: 55px;

            background-color: #B98A55;

            border: 12px solid #8B5A2B;
            border-radius: 30px;

            box-shadow:
                inset 0 0 28px rgba(90, 50, 20, 0.28),
                0 15px 30px rgba(0, 0, 0, 0.18);
        }

        .future-paper{
            position: relative;

            width: min(1050px, 100%);
            margin: 0 auto;

            padding: 34px;

            background: #FFF9E8;

            border-radius: 5px;

            box-shadow: 0 10px 18px rgba(66, 38, 16, 0.25);

            transform: rotate(-0.5deg);
        }

        .future-paper::before{
            content: "";

            position: absolute;

            top: -22px;
            left: 50%;

            width: 140px;
            height: 40px;

            transform: translateX(-50%) rotate(-2deg);

            background: rgba(255, 238, 174, 0.8);

            border-left:
                1px solid rgba(190, 160, 90, 0.35);

            border-right:
                1px solid rgba(190, 160, 90, 0.35);

            box-shadow:
                0 3px 7px rgba(0, 0, 0, 0.13);

            z-index: 2;
        }

        .future-image-box{
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100%;
        }

        .future-image{
            width: 100%;

            display: block;

            object-fit: contain;

            border-radius: 8px;

            box-shadow:
                0 7px 15px rgba(0, 0, 0, 0.15);
        }

        /* 이전 버튼 */
        .home-button{
            position: fixed;

            right: 30px;
            bottom: 30px;

            z-index: 50;
        }

        .home-button a{
            display: inline-block;

            padding: 15px 35px;

            background: #FDFDF8;
            color: #78C35D;

            border: 3px solid #8BD067;
            border-radius: 40px;

            text-decoration: none;
            font-size: 24px;

            transition: 0.3s;
        }

        .home-button a:hover{
            transform: translateY(-5px);

            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.16);
        }

        /* 태블릿 */
        @media (max-width: 900px){

            body{
                background-attachment: scroll;
            }

            h1{
                font-size: 36px;
            }

            .promise-container{
                flex-direction: column;
                align-items: center;

                gap: 35px;
                margin-top: 30px;
            }

            .promise-box{
                width: 100%;
                max-width: 680px;

                padding: 25px;
            }

            .promise-box h2{
                font-size: 28px;
            }

            .menu-image-box{
                height: auto;
                min-height: 420px;
            }

            .menu-image{
                width: 100%;
                height: auto;
            }

            .future-heading{
                font-size: 32px;
            }

            .future-text{
                font-size: 21px;
            }

            .future-board{
                padding: 38px 24px;
                border-width: 9px;
            }

            .future-paper{
                padding: 24px;
            }
        }

        /* 모바일 */
        @media (max-width: 600px){

            h1{
                padding-top: 22px;
                font-size: 32px;
            }

            .promise-container,
            .future-section{
                width: 90%;
            }

            .promise-box{
                padding: 20px;
            }

            .promise-box h2{
                font-size: 25px;
            }

            .menu-image-box{
                min-height: 320px;
            }

            .receipt-content{
                padding: 16px;
                gap: 17px;
            }

            .receipt-input{
                left: 18%;
                top: 39.2%;

                width: 70%;
                height: 25px;

                padding: 1px 4px;

                font-size: 13px;
            }

  .photo-area{

    position:absolute;

    left:4.8%;
    top:39.2%;

    width:90.8%;
    height:38.5%;

    border:none;

    overflow:hidden;

    background:transparent;
}

            .photo-guide{
    position:absolute;
    inset:0;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    z-index:2;
}
.uploaded-photo{

    width:100%;
    height:100%;

    object-fit:cover;

    display:none;

    position:absolute;
    inset:0;

    z-index:1;
}
            .photo-icon{
                font-size: 27px;
            }

            .delete-photo-button{
                top: 44.3%;
                right: 14%;

                width: 32px;
                height: 32px;

                border-width: 1px;

                font-size: 15px;
            }

            .receipt-save-button{
                min-width: 185px;
                min-height: 52px;

                padding: 11px 22px;

                border-width: 2px;
                border-radius: 28px;

                font-size: 20px;
            }

            .future-header{
                width: 100%;

                padding: 22px 18px;

                border-width: 4px;
                border-radius: 24px;
            }

            .future-heading{
                font-size: 28px;
            }

            .future-text{
                font-size: 19px;
            }

            .future-board{
                padding: 32px 16px;
                border-width: 7px;
            }

            .future-paper{
                padding: 18px;
            }

            .future-paper::before{
                width: 100px;
                height: 30px;

                top: -16px;
            }

            .home-button{
                right: 15px;
                bottom: 15px;
            }

            .home-button a{
                padding: 12px 22px;
                font-size: 18px;
            }
        }

        @media (max-width: 390px){

            .promise-container,
            .future-section{
                width: 94%;
            }

            .promise-box{
                padding: 15px;
            }

            .receipt-content{
                padding: 12px;
            }

            .receipt-input{
                font-size: 12px;
            }

            .photo-guide{
                font-size: 13px;
            }

            .photo-icon{
                font-size: 25px;
            }

            .delete-photo-button{
                width: 30px;
                height: 30px;

                font-size: 14px;
            }

            .receipt-save-button{
                min-width: 165px;
                min-height: 48px;

                padding: 9px 18px;

                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <h1>🤝 약숲해 🤝</h1>

    <main class="page-container">

        <div class="promise-container">

            <!-- 왼쪽 메뉴판 -->
            <section class="promise-box menu-box">

                <h2>
                    메뉴를 보고 영수증에 적어주세요!
                </h2>

                <div class="menu-image-box">

                    <img
                        src="eco-menu.png"
                        alt="친환경 실천 메뉴판"
                        class="menu-image"
                    >

                </div>

            </section>


            <!-- 오른쪽 영수증 -->
            <section class="promise-box receipt-box">

                <h2>
                    🧾 나의 실천 영수증 🧾
                </h2>

                <div class="receipt-content">

                    <div class="receipt-form">

                        <img
                            src="dessert-receipt.png"
                            alt="나의 실천 영수증"
                            class="receipt-image"
                        >

                        <input
                            type="text"
                            id="practiceInput"
                            class="receipt-input"
                            placeholder="오늘 실천할 친환경 행동을 적어주세요!"
                            aria-label="오늘 실천할 친환경 행동"
                        >

                        <label
                            for="photoInput"
                            id="photoArea"
                            class="photo-area"
                        >

                            <div class="photo-guide">

                                <span class="photo-icon">
                                    📷
                                </span>

                                <span>
                                    폴라로이드 사진을<br>
                                    여기에 첨부해보세요!
                                </span>

                            </div>

                            <img
                                id="uploadedPhoto"
                                class="uploaded-photo"
                                src=""
                                alt="첨부한 실천 인증 사진"
                            >

                        </label>

                        <input
                            type="file"
                            id="photoInput"
                            class="photo-input"
                            accept="image/*"
                        >

                        <button
                            type="button"
                            id="deletePhotoButton"
                            class="delete-photo-button"
                            aria-label="첨부한 사진 삭제"
                            onclick="deletePhoto(event)"
                        >
                            🗑️
                        </button>

                    </div>

                    <button
                        type="button"
                        class="receipt-save-button"
                        onclick="saveReceipt()"
                    >
                       🌿 실천 저장하기 🌿
                    </button>

                </div>

            </section>

        </div>


        <!-- 미래 뉴스 -->
        <section class="future-section">

            <div class="future-header">

                <h2 class="future-heading">
                    🌱 우리의 실천으로 만든 미래 🌱
                </h2>

                <p class="future-text">
                    미숲랭 3스타를 획득한 여러분 덕분에
                    우리의 숲, 우리의 미래가 이렇게 바뀌었어요!<br>

                    아래의 뉴스에서 그 내용을 확인해보세요!
                </p>

            </div>


            <div class="future-board">

                <div class="future-paper">

                    <div class="future-image-box">

                        <img
                            src="future-news.png"
                            alt="숲을 지킨 미래의 긍정적인 뉴스"
                            class="future-image"
                        >

                    </div>

                </div>

            </div>

        </section>

    </main>


    <div class="home-button">

        <a href="booth.html">
            ➔ 이전으로
        </a>

    </div>


    <script>
        const practiceInput =
            document.getElementById("practiceInput");

        const photoInput =
            document.getElementById("photoInput");

        const photoArea =
            document.getElementById("photoArea");

        const uploadedPhoto =
            document.getElementById("uploadedPhoto");

        const deletePhotoButton =
            document.getElementById("deletePhotoButton");


        photoInput.addEventListener(
            "change",
            function(){

                const file = photoInput.files[0];

                if(!file){
                    return;
                }

                if(!file.type.startsWith("image/")){

                    alert("이미지 파일만 첨부할 수 있어요.");

                    photoInput.value = "";

                    return;
                }

                const reader = new FileReader();

                reader.onload = function(event){

                    showPhoto(event.target.result);

                };

                reader.readAsDataURL(file);
            }
        );


        function showPhoto(imageData){

            uploadedPhoto.src = imageData;

            photoArea.classList.add("has-photo");

            deletePhotoButton.classList.add("show");
        }


        function deletePhoto(event){

    event.preventDefault();
    event.stopPropagation();

    uploadedPhoto.removeAttribute("src");

    photoInput.value = "";

    photoArea.classList.remove("has-photo");

    deletePhotoButton.classList.remove("show");

    localStorage.removeItem("misupReceiptPhoto");
}


        function saveReceipt(){

            const practice =
                practiceInput.value.trim();

            if(!practice){

                alert("실천할 친환경 행동을 먼저 적어주세요! 🌿");

                practiceInput.focus();

                return;
            }

            localStorage.setItem(
                "misupReceiptPractice",
                practice
            );

            if(uploadedPhoto.src){

                try{

                    localStorage.setItem(
                        "misupReceiptPhoto",
                        uploadedPhoto.src
                    );

                }
                catch(error){

                    console.warn(
                        "사진 용량이 커서 저장되지 않았습니다.",
                        error
                    );

                    alert(
                        "실천 내용은 저장되었지만 사진 용량이 커서 사진은 저장되지 않았어요."
                    );

                    return;
                }
            }

            alert("실천 영수증이 저장되었습니다! 🌿");
        }


        function loadReceipt(){

            const savedPractice =
                localStorage.getItem(
                    "misupReceiptPractice"
                );

            const savedPhoto =
                localStorage.getItem(
                    "misupReceiptPhoto"
                );

            if(savedPractice){

                practiceInput.value =
                    savedPractice;
            }

            if(savedPhoto){

                showPhoto(savedPhoto);
            }
        }


        loadReceipt();
    </script>

</body>

</html>
